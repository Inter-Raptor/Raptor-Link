name: Build Raptor Link 0.5.2 Classic Stable

on:
  push:
    branches:
      - release/0.5.2-classic-stable
  workflow_dispatch:

concurrency:
  group: raptor-link-052-classic-stable
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Raptor-Link-0.3.4-Projet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python syntax
        shell: powershell
        run: |
          & ".\RaptorLink\runtime\python.exe" -m py_compile ".\RaptorLink\app.py" ".\RaptorLink\engine.py" ".\RaptorLink\features.py" ".\RaptorLink\icue_worker.py" ".\RaptorLink\cue_base.py" ".\RaptorLink\capture.py" ".\RaptorLink\audio_output.py" ".\RaptorLink\screens.py" ".\RaptorLink\support.py" ".\RaptorLink\window.py"

      - name: Verify engine structure
        shell: powershell
        run: |
          $source = Get-Content ".\RaptorLink\engine.py" -Raw
          if ($source -notmatch "class IcueWorker") { throw "IcueWorker missing" }
          if ($source -notmatch "class Engine") { throw "Engine missing" }
          $loops = ([regex]::Matches($source, "(?m)^    def loop\(self\):")).Count
          if ($loops -lt 2) { throw "Expected separate IcueWorker.loop and Engine.loop" }
          if ($source -match "self\.msi=MsiWorker" -or $source -match "self\.openrgb=OpenRGBWorker") {
            throw "Experimental RGB worker startup still active"
          }

      - name: Run iCUE bridge regression
        shell: powershell
        run: |
          & ".\RaptorLink\runtime\python.exe" ".\raptor-build\test_icue_watchdog.py"

      - name: Run Windows application startup smoke test
        shell: powershell
        run: |
          & ".\RaptorLink\runtime\python.exe" ".\raptor-build\test_052_windows_startup.py"

      - name: Check classic UI JavaScript
        shell: powershell
        run: |
          node --check ".\RaptorLink\web\ui.js"
          node --check ".\RaptorLink\web\extras.js"

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build recovery launcher
        shell: powershell
        run: |
          Push-Location ".\raptor-build"
          & "C:\Program Files (x86)\NSIS\makensis.exe" ".\launcher.nsi"
          Pop-Location
          if (!(Test-Path ".\RaptorLink\RaptorLink.exe")) { throw "Launcher was not generated" }

      - name: Build installer
        shell: powershell
        run: |
          Remove-Item ".\raptor-build\payload" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item ".\RaptorLink" ".\raptor-build\payload" -Recurse
          Get-ChildItem ".\raptor-build\payload" -Directory -Recurse -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location ".\raptor-build"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPPDIR=payload" "/DOUTPUT=..\Raptor-Link-Setup-0.5.2-Classic-Stable.exe" ".\installer.nsi"
          Pop-Location
          Remove-Item ".\raptor-build\payload" -Recurse -Force -ErrorAction SilentlyContinue
          if (!(Test-Path ".\Raptor-Link-Setup-0.5.2-Classic-Stable.exe")) { throw "Installer was not generated" }

      - name: Build source ZIP
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Raptor-Link-0.5.2-Classic-Stable-Source"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item ".\RaptorLink" (Join-Path $stage "RaptorLink") -Recurse
          Copy-Item ".\raptor-build" (Join-Path $stage "raptor-build") -Recurse
          Remove-Item (Join-Path $stage "raptor-build\payload") -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -Directory -Recurse -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $zip = Join-Path (Get-Location) "Raptor-Link-0.5.2-Classic-Stable-Source.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-Link-Setup-0.5.2-Classic-Stable
          path: Raptor-Link-0.3.4-Projet/Raptor-Link-Setup-0.5.2-Classic-Stable.exe
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-Link-0.5.2-Classic-Stable-Source
          path: Raptor-Link-0.3.4-Projet/Raptor-Link-0.5.2-Classic-Stable-Source.zip
          if-no-files-found: error

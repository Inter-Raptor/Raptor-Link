name: Build Raptor Link 0.5.0 Core 3

on:
  push:
    branches:
      - release/0.5.0-core3-stable
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Raptor-Link-0.3.4-Projet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python regression tests
        shell: powershell
        run: |
          & ".\RaptorLink\runtime\python.exe" -m unittest discover -s raptor-build -p "test_*.py"

      - name: Check Core 3 Python syntax
        shell: powershell
        run: |
          & ".\RaptorLink\runtime\python.exe" -m py_compile ".\RaptorLink\app.py" ".\RaptorLink\core3_engine.py" ".\RaptorLink\core3_wled.py" ".\RaptorLink\watchdog.py" ".\RaptorLink\icue_worker.py" ".\RaptorLink\cue_base.py" ".\RaptorLink\diagnostics.py" ".\RaptorLink\support.py" ".\RaptorLink\window.py"

      - name: Check JavaScript syntax
        shell: powershell
        run: node --check ".\RaptorLink\web\ui.js"

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build lean installer payload
        shell: powershell
        run: |
          Remove-Item ".\raptor-build\payload" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item ".\RaptorLink" ".\raptor-build\payload" -Recurse
          $unused = @("engine.py","wled_worker.py","features.py","capture.py","audio_output.py","screens.py","openrgb_source.py","msi_source.py","msi_worker.py","msi_sdk.py","Configuration-Vivien.json","web\extras.js","web\brand.css","web\logo.svg")
          foreach ($item in $unused) { Remove-Item (Join-Path ".\raptor-build\payload" $item) -Recurse -Force -ErrorAction SilentlyContinue }
          Remove-Item ".\raptor-build\payload\native" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem ".\raptor-build\payload" -Directory -Recurse -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build installer
        shell: powershell
        run: |
          Push-Location ".\raptor-build"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DAPPDIR=payload" "/DOUTPUT=..\Raptor-Link-Setup-0.5.0.exe" ".\installer.nsi"
          Pop-Location
          if (!(Test-Path ".\Raptor-Link-Setup-0.5.0.exe")) { throw "Installer was not generated" }

      - name: Build complete project ZIP
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "Raptor-Link-0.5.0-Core3-Source"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item ".\RaptorLink" (Join-Path $stage "RaptorLink") -Recurse
          Copy-Item ".\raptor-build" (Join-Path $stage "raptor-build") -Recurse
          Remove-Item (Join-Path $stage "raptor-build\payload") -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -Directory -Recurse -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $zip = Join-Path (Get-Location) "Raptor-Link-0.5.0-Core3-Source.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path $zip)) { throw "Project ZIP was not generated" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-Link-Setup-0.5.0-Core3
          path: Raptor-Link-0.3.4-Projet/Raptor-Link-Setup-0.5.0.exe
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-Link-0.5.0-Core3-Source
          path: Raptor-Link-0.3.4-Projet/Raptor-Link-0.5.0-Core3-Source.zip
          if-no-files-found: error
